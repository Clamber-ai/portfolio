      <stop offset="0%" stop-color="#00E6A0"/>
      <stop offset="50%" stop-color="#00B2FF"/>
      <stop offset="100%" stop-color="#6C63FF"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B2FF"/>
      <stop offset="100%" stop-color="#6C63FF"/>
